name: RDX L4 BMAD Integration

on:
  pull_request:
    paths:
      - 'tests/bmad/**'
      - '.claude/skills/rdx-dev-story/**'
      - '.claude/skills/rdx-setup/scripts/install.py'
      - '.claude/skills/rdx-setup/scripts/uninstall.py'
      - '.claude/skills/rdx-setup/assets/agent-overrides/**'
      - '.github/workflows/rdx-l4-bmad-integration.yml'
  push:
    branches:
      - main
      - rdx-improvements
    paths:
      - 'tests/bmad/**'
      - '.claude/skills/rdx-dev-story/**'
      - '.claude/skills/rdx-setup/**'

permissions:
  contents: read

jobs:
  l4-bmad:
    name: L4 menu override + wrapper static + setup/uninstall
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pytest pyyaml

      - name: Run L0 regression (contracts)
        run: python -m pytest tests/contracts -v --tb=short

      - name: Run L4 BMAD integration tests
        run: python -m pytest tests/bmad -v --tb=short
