name: RDX Compatibility Matrix

# Phase 6 §6 exit gate:
#   "Compatibility matrix passes for Python 3.11/3.12/3.13 × Ubuntu/macOS"
#
# Locked rows live in tests/compatibility/matrix.md (machine-readable
# JSON block). Drift between this YAML and matrix.md must be caught by
# tests/compatibility/test_compat_matrix.py.

on:
  pull_request:
    paths:
      - 'rdx-validator/**'
      - 'tests/contracts/**'
      - 'tests/unit/**'
      - 'tests/evals/**'
      - 'tests/compatibility/**'
      - '.github/workflows/rdx-compat-matrix.yml'
  push:
    branches:
      - main
      - rdx-improvements
    paths:
      - 'rdx-validator/**'
      - 'tests/compatibility/**'
      - '.github/workflows/rdx-compat-matrix.yml'

permissions:
  contents: read

jobs:
  compat:
    name: ${{ matrix.os }} / py ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pytest pyyaml

      - name: L0 contracts
        run: python -m pytest tests/contracts -v --tb=short

      - name: L1 + L2 validator units
        run: python -m pytest tests/unit -v --tb=short

      - name: L5 eval harness contracts
        run: python -m pytest tests/evals -v --tb=short

      - name: Compatibility matrix shape
        run: python -m pytest tests/compatibility -v --tb=short
