name: RDX L6/L7 Hook + CI + Mutation

# Phase 5 — runs the L6 hook end-to-end tests, the L6 CI workflow
# tests (which exercise rdx-ci-runner.py in Option B mode), and the
# L7 adversarial mutation suite against this repository's own diff.

on:
  pull_request:
    paths:
      - '.claude/skills/rdx-hooks/**'
      - '.github/scripts/rdx-ci-runner.py'
      - '.github/workflows/rdx-gate.yml'
      - '.github/workflows/rdx-l6-l7.yml'
      - 'docs/branch-protection.md'
      - 'rdx-validator/rdx_validator/preflight.py'
      - 'rdx-validator/rdx_validator/cli.py'
      - 'tests/ci/**'
      - 'tests/mutation/**'
  push:
    branches:
      - main
      - rdx-improvements
    paths:
      - '.claude/skills/rdx-hooks/**'
      - '.github/scripts/rdx-ci-runner.py'
      - '.github/workflows/rdx-gate.yml'
      - 'rdx-validator/**'
      - 'tests/ci/**'
      - 'tests/mutation/**'

permissions:
  contents: read

jobs:
  l6-l7:
    name: L6 + L7 + V5 acceptance
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pytest pyyaml

      - name: Configure git identity for sample-repo fixtures
        run: |
          git config --global user.name "RDX CI"
          git config --global user.email "rdx-ci@example.com"
          git config --global init.defaultBranch main

      - name: Run L6 hook + CI runner tests
        run: python -m pytest tests/ci -v --tb=short

      - name: Run L7 mutation suite
        run: python -m pytest tests/mutation -v --tb=short
