name: RDX L4 Modes + Doc Honesty

on:
  pull_request:
    paths:
      - 'tests/bmad/modes/**'
      - 'tests/acceptance/test_doc_honesty.py'
      - 'tests/unit/validator/test_l1_mode_label.py'
      - '.claude/skills/rdx-setup/scripts/install.py'
      - '.claude/skills/rdx-setup/assets/modes.md'
      - '.claude/skills/rdx-setup/assets/module.yaml'
      - '.claude/skills/rdx-setup/SKILL.md'
      - '.claude/skills/rdx-dev-story/SKILL.md'
      - 'rdx-validator/rdx_validator/cli.py'
      - '.github/workflows/rdx-l4-modes.yml'
  push:
    branches:
      - main
      - rdx-improvements
    paths:
      - 'tests/bmad/modes/**'
      - 'tests/acceptance/test_doc_honesty.py'
      - 'tests/unit/validator/test_l1_mode_label.py'
      - '.claude/skills/rdx-setup/**'
      - '.claude/skills/rdx-dev-story/**'
      - 'rdx-validator/**'

permissions:
  contents: read

jobs:
  l4-modes:
    name: L4 mode selector + validator mode_label + doc-honesty
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pytest pyyaml

      - name: Run mode selector + naming tests (L4)
        run: python -m pytest tests/bmad/modes -v --tb=short

      - name: Run validator mode_label tests (L1)
        run: python -m pytest tests/unit/validator/test_l1_mode_label.py -v --tb=short

      - name: Run doc-honesty acceptance (T-V5-ACC-06)
        run: python -m pytest tests/acceptance/test_doc_honesty.py -v --tb=short
