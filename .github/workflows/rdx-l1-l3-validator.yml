name: RDX L1–L3 Validator

on:
  pull_request:
    paths:
      - 'rdx-validator/**'
      - 'tests/unit/validator/**'
      - 'tests/integration/cargo/**'
      - 'tests/fixtures/diffs/**'
      - 'tests/fixtures/evidence/**'
      - 'tests/fixtures/baseline/**'
      - 'tests/fixtures/policy/**'
      - 'tests/fixtures/cargo-projects/**'
      - 'tests/contracts/router-rules.json'
      - 'tests/contracts/rule-check-map.json'
      - 'tests/contracts/status-definitions.json'
      - 'tests/conftest.py'
      - '.github/workflows/rdx-l1-l3-validator.yml'
  push:
    branches:
      - main
      - rdx-improvements
    paths:
      - 'rdx-validator/**'
      - 'tests/unit/validator/**'
      - 'tests/integration/cargo/**'
      - 'tests/fixtures/**'

permissions:
  contents: read

jobs:
  l1-l3-validator:
    name: L1 unit + L2 fixture + L3 cargo
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pytest pyyaml

      - name: Run L0 regression
        run: python -m pytest tests/contracts -v --tb=short

      - name: Run L1 unit tests
        run: python -m pytest tests/unit/validator -v --tb=short

      - name: Run L3 integration tests
        run: python -m pytest tests/integration/cargo -v --tb=short
