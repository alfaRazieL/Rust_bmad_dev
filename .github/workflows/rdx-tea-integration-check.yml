name: rdx-tea-integration branch check

# Fail-closed CI for the rdx-tea-integration branch ONLY.
#
# This workflow deliberately does NOT trigger on push or PR events
# targeting `main`. If a copy of it were ever merged into `main` and
# the trigger set widened, the top-level guard steps below would still
# refuse to run the suite outside the intended branch.
#
# Owned by the RDX-TEA adapter D3.1 closure. See
# rdx-tea/research/D3_1_PRODUCTION_LAYOUT_AUDIT.md §10.

on:
  push:
    branches:
      - rdx-tea-integration
  pull_request:
    branches:
      - rdx-tea-integration

concurrency:
  group: rdx-tea-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: refuse-on-main
    runs-on: ubuntu-latest
    steps:
      - name: assert-not-main
        run: |
          set -euo pipefail
          echo "ref=$GITHUB_REF base=${GITHUB_BASE_REF:-none} head=${GITHUB_HEAD_REF:-none}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "::error::this workflow must not run on main" >&2
            exit 3
          fi
          if [ "${GITHUB_BASE_REF:-}" = "main" ]; then
            echo "::error::pull requests against main are not accepted by this workflow" >&2
            exit 3
          fi

  test:
    name: rdx-tea pytest
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: set-up-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install-deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest jsonschema pyyaml
      - name: bootstrap-upstream
        env:
          # D3.3.2 §11.1 — single canonical upstream root shared by
          # bootstrap, tests, and the live harness.
          RDX_TEA_UPSTREAM_ROOT: ${{ github.workspace }}/upstream
          RDX_TEA_BOOTSTRAP_SKIP_WORKTREE_CHECK: "0"
        run: |
          set -euo pipefail
          mkdir -p "$RDX_TEA_UPSTREAM_ROOT"
          python rdx-tea/poc/install-tree/_bmad/rdx-tea/bootstrap/bootstrap.py \
              --target-dir "$RDX_TEA_UPSTREAM_ROOT"
      - name: source-lock-verify
        env:
          RDX_TEA_UPSTREAM_ROOT: ${{ github.workspace }}/upstream
        run: |
          set -euo pipefail
          # D3.3.2 §12 — real bootstrap --verify-only. No `|| echo`
          # masking; a failure here fails the job.
          mkdir -p rdx-tea/ci-artifacts
          python rdx-tea/poc/install-tree/_bmad/rdx-tea/bootstrap/bootstrap.py \
              --target-dir "$RDX_TEA_UPSTREAM_ROOT" \
              --verify-only \
              | tee rdx-tea/ci-artifacts/source-lock-report.json
          cp rdx-tea/poc/install-tree/_bmad/rdx-tea/bootstrap/sources.lock \
              rdx-tea/ci-artifacts/sources.lock
      - name: canonical-deterministic-suite
        env:
          RDX_TEA_UPSTREAM_ROOT: ${{ github.workspace }}/upstream
        run: |
          set -euo pipefail
          mkdir -p rdx-tea/ci-artifacts
          # D3.3.2 §11.3 — a single canonical collection from the repo
          # root, no re-execution of the same nodes from sub-roots. The
          # live-harness suite is a disjoint node set (different rootdir)
          # so it runs separately.
          python -m pytest -q --tb=line --no-header \
              --junitxml=rdx-tea/ci-artifacts/pytest-canonical.junit.xml
          python -m pytest rdx-tea/live-harness/tests rdx-tea/evals/tests \
              -q --tb=line --no-header \
              --junitxml=rdx-tea/ci-artifacts/pytest-live-harness.junit.xml
      - name: refuse-mandatory-skips
        env:
          RDX_TEA_UPSTREAM_ROOT: ${{ github.workspace }}/upstream
        run: |
          set -euo pipefail
          # D3.3.2 §11.2 — parse the JUnit XML for real skips, not the
          # collect-only surrogate that misses fixture-body pytest.skip().
          python rdx-tea/live-harness/ci_check.py refuse-skips \
              rdx-tea/ci-artifacts/pytest-canonical.junit.xml
      - name: unique-test-count
        run: |
          set -euo pipefail
          python rdx-tea/live-harness/ci_check.py unique-count \
              rdx-tea/ci-artifacts/pytest-canonical.junit.xml \
              rdx-tea/ci-artifacts/pytest-live-harness.junit.xml \
              | tee rdx-tea/ci-artifacts/unique-count.json
      - name: sha256-manifest
        run: |
          set -euo pipefail
          {
            echo "# SHA256 manifest for CI artifacts on $(git rev-parse HEAD)"
            find rdx-tea/ci-artifacts -type f -not -name 'sha256-manifest.txt' \
                | sort \
                | xargs -I{} sh -c 'printf "%s  %s\n" "$(sha256sum {} | cut -d\  -f1)" "{}"'
          } > rdx-tea/ci-artifacts/sha256-manifest.txt
          cat rdx-tea/ci-artifacts/sha256-manifest.txt
      - name: record-run-metadata
        run: |
          set -euo pipefail
          cat > rdx-tea/ci-artifacts/run-metadata.json <<EOF
          {
            "tested_subject_sha": "$(git rev-parse HEAD)",
            "github_actions_run_id": "${GITHUB_RUN_ID}",
            "github_actions_run_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "github_actions_run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "workflow": "${GITHUB_WORKFLOW}",
            "branch": "${GITHUB_REF_NAME}"
          }
          EOF
          cat rdx-tea/ci-artifacts/run-metadata.json
      - name: upload-artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdx-tea-ci-artifacts-${{ github.run_id }}
          path: rdx-tea/ci-artifacts/**
          if-no-files-found: error
          retention-days: 30
      - name: verify-branch-and-remote
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF##refs/heads/}}"
          if [ "$BRANCH" != "rdx-tea-integration" ]; then
            echo "::error::branch must be rdx-tea-integration, got $BRANCH" >&2
            exit 4
          fi
          echo "branch OK: $BRANCH"

  no-main-modifications:
    name: no changes outside rdx-tea and .github
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check-diff-scope
        run: |
          set -euo pipefail
          git fetch origin main --depth=100
          BASE=$(git merge-base origin/main HEAD)
          if [ -z "$BASE" ]; then
            echo "::warning::cannot compute merge-base with main; skipping scope check"
            exit 0
          fi
          # Every changed path since the branch left main must lie under
          # rdx-tea/ or .github/workflows/rdx-tea-*.yml. Any other change
          # is refused so a hostile PR to this branch cannot ship a
          # production-file edit.
          bad=$(git diff --name-only "$BASE"..HEAD | grep -Ev '^rdx-tea/|^\.github/workflows/rdx-tea-' || true)
          if [ -n "$bad" ]; then
            echo "::error::changes outside rdx-tea/ detected:" >&2
            echo "$bad" >&2
            exit 5
          fi
          echo "scope OK: only rdx-tea/ and .github/workflows/rdx-tea-*.yml changed"
