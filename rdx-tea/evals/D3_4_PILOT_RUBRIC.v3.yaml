# D3.3.2 §14. Pilot grading rubric v3 — precommitted before any pilot run.
#
# CORRECTED FROM D3_4_PILOT_RUBRIC.yaml (v2):
#
#  * v2 said "≥ 2 of 3 positive scenarios" but the pilot only has
#    2 positive scenarios (docs-only is a negative control). v3 pins
#    2 positive scenarios explicitly and states the decision rule
#    unambiguously.
#  * v2 mixed candidate-fidelity and comparative-quality metrics in the
#    same decision rule; v3 separates them so a candidate can PASS
#    fidelity without artificially inflating comparative signal.
#  * v2 hinted at blinded LLM grading; v3 pins the grader interface,
#    prompt hash source, and disagreement handling.
#
# v3 is a fresh file; D3_4_PILOT_RUBRIC.yaml (v2) is retained as
# `superseded` for auditability.

schema_version: rdx-tea-pilot-rubric.v3
supersedes: rdx-tea/evals/D3_4_PILOT_RUBRIC.yaml
last_edited_before_first_pilot_run: true

positive_scenarios: [test-design-async, atdd-api-async-corrected]
negative_control_scenarios: [docs-only-rust-repo]

task_scenario_binding:
  test-design-async:
    kind: positive
    workflow: test-design
    expected_active_pack_ids: [async]
    expected_core_subset_min: [CORE-001, CORE-004, CORE-009]
    expected_rp_ids_min: [RP-ASYNC-005]
    forbidden_rp_prefixes: [RP-UNSAFE-, RP-FFI-, RP-MACRO-, RP-CARGO-]
  atdd-api-async-corrected:
    kind: positive
    workflow: atdd
    expected_active_pack_ids: [api, async]
    expected_core_subset_min: [CORE-001, CORE-004, CORE-009]
    expected_rp_ids_min: [RP-ASYNC-005, RP-API-001]
    forbidden_rp_prefixes: [RP-UNSAFE-, RP-FFI-, RP-MACRO-]
  docs-only-rust-repo:
    kind: negative-control
    workflow: test-design
    expected_active_pack_ids: []
    expected_core_subset_min: []
    expected_rp_ids_min: []
    forbidden_rp_prefixes: [RP-]

candidate_integration_fidelity:
  applied_to_arms: [candidate]
  metrics:
    correct_active_packs:
      kind: boolean
      formula: set(candidate.active_packs) == set(expected_active_pack_ids)
    expected_rp_ids_present:
      kind: fraction
      formula: |
        count(rid in artefact.text for rid in expected_rp_ids_min)
        / max(1, count(expected_rp_ids_min))
      docs_only_special: metric_omitted_when_expected_set_is_empty
    invented_rule_id_rate:
      kind: fraction
      formula: |
        count(rid in artefact.text and rid not in KB.all_rule_ids)
        / max(1, count(rid in artefact.text))
    forbidden_pack_never_active:
      kind: boolean
      formula: no forbidden_rp_prefix in candidate.active_packs
    sidecar_verifier_pass:
      kind: boolean
      formula: candidate.verifier_all_pass == true
    exact_bundle_hash_present:
      kind: boolean
      formula: hashes.bundle == computed(bundle_file)
    observed_sequential:
      kind: enum
      values:
        - OBSERVED_SEQUENTIAL
        - OBSERVED_SUBAGENT
        - TRANSCRIPT_MISSING
        - TRANSCRIPT_INVALID
        - INFERRED_ABSENT
      required_value: OBSERVED_SEQUENTIAL

comparative_artifact_quality:
  applied_to_arms: [baseline, candidate]
  layer1_deterministic_detectors:
    cancellation_specificity:
      kind: boolean
      detector: |
        any of [
          "cancellation-safe", "cancel-safe", "cancellation point",
          "select! { _ = cancel_token", "tokio::select! { biased",
          "AbortHandle", "cancellation semantics"
        ] in artefact.text
    timeout_specificity:
      kind: boolean
      detector: |
        any of [
          "timeout(", "tokio::time::timeout", "deadline",
          "hard timeout", "soft timeout"
        ] in artefact.text
    shutdown_specificity:
      kind: boolean
      detector: |
        any of [
          "graceful shutdown", "drain in-flight",
          "shutdown broadcast", "SIGTERM handling"
        ] in artefact.text
    partial_progress_preservation:
      kind: boolean
      detector: |
        any of [
          "partial progress", "resume from checkpoint",
          "idempotent write", "torn write", "no torn write"
        ] in artefact.text
    cleanup_ownership:
      kind: boolean
      detector: |
        any of [
          "drop guard", "RAII cleanup", "cleanup owner",
          "who owns cleanup", "ownership of cleanup"
        ] in artefact.text
    task_lifecycle_ownership:
      kind: boolean
      detector: |
        any of [
          "task lifecycle", "spawn/join", "who joins",
          "task ownership", "abort semantics"
        ] in artefact.text
    api_compatibility_boundary:
      kind: boolean
      detector: |
        any of [
          "public api", "public async fn", "boundary contract",
          "semver", "breaking change"
        ] in artefact.text
    api_error_boundary_specificity:
      kind: boolean
      detector: |
        any of [
          "error boundary", "public error type",
          "error contract", "exhaustive match"
        ] in artefact.text
    negative_path_coverage:
      kind: boolean
      detector: |
        any of [
          "error case", "failure mode", "negative test",
          "invalid input", "adversarial input"
        ] in artefact.text
    executable_test_detail:
      kind: boolean
      detector: |
        any of [
          "assert_eq!", "#[tokio::test]", "expect(",
          "Given/When/Then", "acceptance criteria:"
        ] in artefact.text
    contradictions:
      kind: int
      detector: count of sentences containing mutually-exclusive claims
    hallucinated_project_facts:
      kind: int
      detector: |
        count of file paths / module names in artefact.text
        that do NOT exist in the fixture project tree
  layer2_blinded_llm_grader:
    enabled: true
    model_policy:
      allowed: [claude-haiku-4-5-20251001, claude-sonnet-4-6]
      forbidden: [claude-opus-4-7, opus]
    grader_prompt_hash_source: rdx-tea/evals/grading/prompts/comparative_grader.v1.md
    graded_metrics:
      - cancellation_specificity_semantic
      - timeout_specificity_semantic
      - shutdown_specificity_semantic
      - partial_progress_preservation_semantic
      - cleanup_ownership_semantic
      - task_lifecycle_ownership_semantic
      - api_compatibility_semantic
      - api_error_boundary_semantic
      - actionability_semantic
      - completeness_semantic
    disagreement_handling: |
      When deterministic detector and LLM grader disagree on a boolean:
      record BOTH results in the per-sample JSON; treat the metric as
      INCONCLUSIVE for that sample; exclude it from the effect
      calculation. NEVER silently overwrite one signal with the other.
    output_schema: rdx-tea/evals/grading/schemas/llm-grader-result.v1.schema.json
  layer3_efficiency:
    wall_clock_seconds: int
    transcript_bytes: int
    artifact_bytes: int
    tokens_input: int
    tokens_output: int
    est_cost_usd: number

docs_only_control:
  metrics:
    rdx_leakage_count:
      kind: int
      required_value: 0
    irrelevant_rust_requirement_count:
      kind: int
      required_value: 0
    forbidden_rp_prefix_hits:
      kind: int
      required_value: 0

evaluator_isolation:
  blinding: mandatory
  arm_sanitisation:
    filenames_renamed_to: sample-XXX
    frontmatter_masked: true
    rdx_id_pattern_stripped: '\\bRP-[A-Z]+-\\d+\\b'
    wrapper_name_stripped: 'rdx-tea-\\w+'
    sidecars_hidden_from_grader: true
    path_prefixes_normalised: [baseline/, candidate/]
  candidate_integration_grader:
    sees_full_evidence_bundle: true
    scope: candidate_only
  disagreement_and_leakage_tests:
    - filename_leakage_zero
    - metadata_leakage_zero
    - path_leakage_zero
    - rdx_id_leakage_in_sanitised_input_zero
    - mapping_unreadable_by_comparative_grader

decision_rule:
  # UNAMBIGUOUS PER D3.3.2 §14.2.
  # Two positive scenarios total. Candidate must show improvement on
  # BOTH positive scenarios OR one positive scenario with a persistent
  # improvement of ≥ 2 semantic detectors and no regression on the
  # other positive scenario. Docs-only control PASSES with zero
  # leakage/irrelevance under both arms.
  positive_signal_requires_all:
    - candidate_integration_fidelity PASSES ALL boolean gates
    - candidate does not regress on hallucinated_project_facts or
      contradictions (both counters ≤ baseline mean, per scenario)
    - EITHER
        (a) candidate shows persistent improvement (post-sanitisation)
            on at least three of the semantic boolean detectors on
            BOTH positive scenarios
      OR
        (b) candidate shows persistent improvement on at least three of
            the semantic boolean detectors on ONE positive scenario
            AND shows no regression on the other positive scenario
    - docs-only control PASSES for BOTH arms (leakage_count == 0,
      irrelevant_rust_requirement_count == 0)
    - grader agreement ≥ grader_agreement_min
    - zero arm leakage in the sanitised input
    - zero run_id mismatch (run_id_handshake.mismatch == false for all
      completed runs)

  inconclusive_when:
    - any positive scenario × arm has fewer than 3 successful runs and
      no precommitted retry rule explains the gap
    - candidate wins on some semantic metrics and loses on others
      without a dominant direction

  negative_when:
    - baseline strictly better on comparative_artifact_quality boolean
      counts on BOTH positive scenarios
    - candidate hallucinates more RP-* IDs than baseline (invented
      RP-* IDs in candidate arm — noting baseline emits none by design)

  invalid_when:
    - any arm produced no artefact
    - transcripts show subagent dispatch under either arm
    - arm leakage detected in sanitised input
    - schedule modified after first run
    - fixture hash changed after first run
    - run_id mismatch in run_id_handshake

grader_agreement_min: 0.75

pilot_verdicts:
  - PILOT_SIGNAL_POSITIVE
  - PILOT_INCONCLUSIVE
  - PILOT_NEGATIVE
  - PILOT_INVALID
