# RDX Test Cases — machine-readable catalog
#
# Schema:
#   id: stable ID, format T-L<layer>-<topic>-<NNN> or T-V<5|6>-<NN>
#   version: V5 | V6 | shared
#   phase: 0..10 (which implementation phase this test belongs to)
#   requirement_ids: list of R-V5-DoD-XX / R-V6-DoD-XX / R-CORE-XXX / R-PACK-* IDs
#   rule_ids: KB rule IDs touched (CORE-XXX, RP-PACK-XXX)
#   layer: L0..L8 (per RDX_TEST_STRATEGY.md §2)
#   title: short human-readable
#   preconditions: list
#   fixture: path under tests/ where the input lives
#   steps: list of human-readable execution steps
#   expected: prose description of expected outcome
#   expected_status: one of the taxonomy statuses (or n/a for L0/L1)
#   expected_exit_code: 0|1|2|3|4|n/a
#   blocking: true | false | conditional
#   oracle: what proves correctness (deterministic | golden | LLM-judge | manual)
#   artifacts: outputs to retain on failure
#   automation: full | manual | semi
#   gate: phase gate this test guards (entry | exit | none)

